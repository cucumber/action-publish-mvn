name: "Publish to Maven Central"
description: "Publish an Maven module from a pom.xml"
inputs:
  gpg-private-key:
    description: GPG private key for signing the published artifacts
    required: true
  gpg-passphrase:
    description: Passphrase for the GPG key
    required: true
  nexus-username:
    description: Username (not email!) for your Nexus repository manager account
    required: true
  nexus-password:
    description: Password for your Nexus account
    required: true
  server-id:
    description: Nexus server id
    required: false
    default: central
  maven-goals:
    description: Maven goals to run
    required: false
    default: deploy
  maven-profiles:
    description: Maven profiles
    required: false
    default: sign-source-javadoc
  working-directory:
    description: "Path within the repo to the folder where the pom.xml file lives"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: import GPG key
      run: |
        echo -e "${INPUT_GPG_PRIVATE_KEY}" | gpg --batch --import --no-tty
        echo "hello world" > temp.txt
        gpg --detach-sig \
          --yes -v \
          --output=/dev/null \
          --pinentry-mode loopback \
          --passphrase "${INPUT_GPG_PASSPHRASE}" temp.txt
        rm temp.txt
      shell: bash
      env:
        INPUT_GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        INPUT_GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
    - name: publish artefacts
      run: |
        mvn ${INPUT_MAVEN_GOALS} \
          --batch-mode \
          --settings ${{ github.action_path }}/settings.xml \
          --activate-profiles ${INPUTS_MAVEN_PROFILES} \
          -DskipTests=true \
          -DskipITs=true \
          -Darchetype.test.skip=true
      shell: bash
      env:
        INPUT_MAVEN_GOALS: ${{ inputs.maven-goals }}
        INPUTS_MAVEN_PROFILES: ${{ inputs.maven-profiles }}
        INPUT_SERVER_ID: ${{ inputs.server-id }}
        INPUT_NEXUS_USERNAME: ${{ inputs.nexus-username }}
        INPUT_NEXUS_PASSWORD: ${{ inputs.nexus-password }}
        MAVEN_GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
      working-directory: ${{ inputs.working-directory }}

branding:
  icon: package
  color: green
